[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshgpu"
version = "0.1.0"
description = "Distributed GPU runtime for model sharding across multiple machines"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "click>=8.1",
    "uvicorn>=0.27",
    "fastapi>=0.110",
    "cryptography>=42.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
native = [
    "vllm>=0.4",
]
hf = [
    "transformers>=4.56,<5",
    "accelerate>=0.26",
    "peft>=0.14",
]
data = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
meshgpu = "meshgpu.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/meshgpu"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
